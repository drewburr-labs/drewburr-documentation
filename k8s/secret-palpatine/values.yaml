image:
  repository: ghcr.io/drewburr-labs/secret-palpatine
  tag: latest
  pullPolicy: Always

host: palpatine.drewburr.com

# Game state is saved here so restarts don't end games in progress.
state:
  storageClassName: zfs-nvmeof
  size: 1Gi

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
