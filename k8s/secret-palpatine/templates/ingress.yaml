---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secret-palpatine
  namespace: {{ .Release.Namespace }}
  annotations:
    # Class via annotation (not spec.ingressClassName): the API server can reject
    # an Ingress that sets both.
    kubernetes.io/ingress.class: nginx-external
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.kubernetes.io/target: ip.drewburr.com
    # Players hold a WebSocket open for the whole game.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secret-palpatine
                port:
                  name: http
  tls:
    - hosts:
        - {{ .Values.host }}
      secretName: secret-palpatine-tls
