---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-palpatine
  namespace: {{ .Release.Namespace }}
  labels:
    app: secret-palpatine
spec:
  # Game rooms live in memory: exactly one pod, and never two at once during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: secret-palpatine
  template:
    metadata:
      labels:
        app: secret-palpatine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000 # lets the non-root user write the state volume
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-palpatine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "3000"
            # Join links and QR codes point here.
            - name: PUBLIC_URL
              value: "https://{{ .Values.host }}"
            - name: METRICS_PORT
              value: "9091"
            # Saved on every change and on SIGTERM; restored on start.
            - name: STATE_FILE
              value: /data/state.json
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9091
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /data
          # Check often so a restarted pod takes traffic within ~2s of listening.
          readinessProbe:
            httpGet:
              path: /api/base
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/base
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: secret-palpatine-state
