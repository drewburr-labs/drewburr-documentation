---
services:
  - name: zfs-exporter
    ips:
      - 192.168.4.31

endpoint:
  honorLabels: true
  path: /metrics
  port: http
  scheme: http
  # scrapeTimeout must be <= interval, or prometheus-operator rejects the
  # ServiceMonitor (default interval is 30s).
  interval: 60s
  scrapeTimeout: 60s
port: 9134
labels:
  app: zfs-exporter
