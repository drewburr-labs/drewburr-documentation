# Renders the snmp_exporter auth file from the manually-created
# `apc-ups-snmp` secret in shared-secrets (see values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apc-ups-snmp-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shared-secrets
    kind: ClusterSecretStore
  target:
    name: apc-ups-snmp-auth
    template:
      data:
        auth.yml: |
          auths:
            apc_ups:
              community: {{ `{{ .community | quote }}` }}
              version: 2
  data:
    - secretKey: community
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .Values.snmpSecret.sourceKey }}
        metadataPolicy: None
        property: community
