# Projects the manually-created Discord webhook from shared-secrets into this
# namespace for Grafana's "drewburr-labs Discord" contact point
# (files/alerting/contactpoints.yaml, via env DISCORD_WEBHOOK_URL).
#
# Source secret (one-time, value never committed — this repo is public):
#   kubectl -n shared-secrets create secret generic grafana-discord-webhook \
#     --from-literal=url=<discord webhook url>
#
# Sync wave -1 so the Secret exists before the Grafana Deployment rolls;
# the env var only picks up the value at pod start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-discord-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shared-secrets
    kind: ClusterSecretStore
  target:
    name: grafana-discord-webhook
  data:
    - secretKey: url
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: grafana-discord-webhook
        metadataPolicy: None
        property: url
