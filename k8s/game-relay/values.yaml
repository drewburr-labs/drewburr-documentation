---
# https://github.com/drewburr-labs/game-relay
image:
  repository: ghcr.io/drewburr-labs/game-relay
  # Tracks main. A new image is only picked up when the pod restarts
  # (pullPolicy Always); ArgoCD won't notice a new push on its own.
  tag: latest
  pullPolicy: Always

port: 24680
# TCP, Prometheus text at /metrics and liveness at /healthz. Private: only on the
# ClusterIP relay-metrics Service, never the LoadBalancer or the port forward.
metricsPort: 24681

serviceMonitor:
  interval: 30s
  scrapeTimeout: 10s

service:
  # Static so the UDM port forward (WAN udp/24680 -> this IP) stays valid.
  loadBalancerIP: 192.168.4.68
  hostnames:
    - relay.drewburr.com
    # HOST_NAME in relay_protocol.gd (game-relay and Saucer Showdown's copy) is
    # still saucer.drewburr.com; shipped game builds use it. Drop only once
    # games have moved to relay.drewburr.com.
    - saucer.drewburr.com

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
