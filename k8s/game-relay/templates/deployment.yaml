---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  labels:
    app.kubernetes.io/name: game-relay
spec:
  # Rooms live in memory: exactly one replica, and never two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: game-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            # args replace the image's CMD, so metrics must be asked for here too.
            - --port={{ .Values.port }}
            - --metrics-port={{ .Values.metricsPort }}
          ports:
            - name: relay
              containerPort: {{ .Values.port }}
              protocol: UDP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          # /healthz only shows the process is serving; relay_probe.gd
          # from the game-relay repo checks the UDP relay end to end.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp # HOME=/tmp; Godot writes user data there
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
