# Self-hosted Readarr-compatible metadata server (blampe/rreading-glasses)
# giving bookshelf its metadata instead of the shared hardcover.bookinfo.pro
# proxy (which rate-limited bookshelf search to death on 2026-08-22).
#
# Runs in GOODREADS mode (--upstream=www.goodreads.com), NOT Hardcover mode.
# Hardcover mode needs an API key and, because upstream's GraphQL client
# batches in a way Hardcover rejects (array format + 5-top-level-query cap),
# a custom patched+throttled image — which paced cold searches at ~100s
# against Hardcover's 60/min limit. Goodreads mode uses a completely
# different scrape path (internal/gr.go, HTTP GET), needs no key and no
# throttle, and returns sub-second searches with the STOCK image. (Hardcover
# mode is recoverable from git history — PRs #33-#35 — if Goodreads scraping
# ever breaks.) Distroless, runs as 65532. No ingress: bookshelf-only.
replicaCount: 1

image:
  repository: docker.io/blampe/rreading-glasses
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}

podSecurityContext: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

command: ["/main", "serve"]
args: ["--upstream=www.goodreads.com", "--verbose"]

# Ports to be exposed, grouped by services
services:
  - name: http
    type: ClusterIP
    port: 8788
    protocol: TCP

# Upstream warns it will use all available memory for in-memory caching;
# the limit is the cache ceiling, not a leak guard.
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 512Mi

# Goodreads mode needs no auth (Hardcover mode used HARDCOVER_AUTH from an
# out-of-band Secret; no longer required).
env: []

# Key: value environment variables to be appended to env
envVars:
  TZ: America/New_York
  POSTGRES_HOST: rreading-glasses-db-db
  POSTGRES_DATABASE: rreading-glasses
  POSTGRES_USER: rreading-glasses
  POSTGRES_PASSWORD: rg-cache-n4Dp7qXe2w

# Stateless; postgres holds the (rebuildable) cache.
persistence: []

nodeSelector: {}

tolerations:
  - key: compute
    operator: Exists
    effect: PreferNoSchedule

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: compute
              operator: In
              values:
                - 'true'

startupProbe:
  tcpSocket:
    port: 8788
  failureThreshold: 30
  periodSeconds: 10
livenessProbe:
  tcpSocket:
    port: 8788
readinessProbe:
  tcpSocket:
    port: 8788
