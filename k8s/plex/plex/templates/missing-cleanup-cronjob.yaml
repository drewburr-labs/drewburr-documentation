{{- if .Values.missingCleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "plex.fullname" . }}-missing-cleanup
  labels:
    {{- include "plex.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.missingCleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          # Deliberately NOT the chart selectorLabels: those would match the
          # plex-plex-https Service selector and make kube-proxy load-balance
          # Plex traffic to this job pod (instant connection-refused — this is
          # exactly what broke the first missing-cleanup runs).
          labels:
            app.kubernetes.io/name: {{ include "plex.name" . }}-missing-cleanup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          # Run as the media uid/gid directly; no fsGroup -- it would make the
          # kubelet recursively chown the entire plex-data volume every mount.
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
          containers:
            - name: missing-cleanup
              image: {{ .Values.missingCleanup.image | quote }}
              env:
                - name: PLEX_URL
                  value: {{ .Values.missingCleanup.plexUrl | quote }}
                - name: PLEX_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: plex-token
                      key: token
                - name: LIBRARY_PATH
                  value: {{ .Values.missingCleanup.libraryPath | quote }}
                - name: DRY_RUN
                  value: {{ .Values.missingCleanup.dryRun | quote }}
                - name: MAX_MISSING_PERCENT
                  value: {{ .Values.missingCleanup.maxMissingPercent | quote }}
              command: ["python3", "/scripts/missing-cleanup.py"]
              volumeMounts:
                - name: plex-data
                  mountPath: /data
                  readOnly: true
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: plex-data
              persistentVolumeClaim:
                claimName: plex-data
            - name: script
              configMap:
                name: {{ include "plex.fullname" . }}-missing-cleanup
{{- end }}
