# https://github.com/calibrain/shelfmark
# Formerly calibre-web-automated-book-downloader. Search/download UI that
# drops books into the CWA ingest folder. Runs non-root; entrypoint requires
# writable /tmp/shelfmark, /var/log/shelfmark, and /config in that mode.
replicaCount: 1

image:
  repository: ghcr.io/calibrain/shelfmark
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

# Ports to be exposed, grouped by services
services:
  - name: http
    type: ClusterIP
    port: 8084
    protocol: TCP
    # Served under books.drewburr.com/request (URL_BASE below). No tls block:
    # the calibre-web ingress already terminates TLS for this host and a
    # second cert-manager claim on the same host would fight it. DNS is
    # likewise owned by the calibre-web ingress record.
    ingress:
      className: nginx-external
      # Release lookups run through the Cloudflare bypasser and can take up
      # to EXT_BYPASSER_TIMEOUT (180s, set in shelfmark's settings UI);
      # nginx's default 60s proxy-read timeout returned the HTML error page
      # mid-lookup, which the UI failed to parse as JSON.
      annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "200"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "200"
      hosts:
        - host: books.drewburr.com
          paths:
            - path: /request
              pathType: ImplementationSpecific

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Appended to env. Supports envFrom
env: []

# Key: value environment variables to be appended to env
envVars:
  TZ: America/New_York
  INGEST_DIR: /cwa-book-ingest
  # Built-in SeleniumBase bypasser needs image-layer writes that fail
  # non-root; reuse the existing flare-bypasser deployment instead.
  USING_EXTERNAL_BYPASSER: true
  EXT_BYPASSER_URL: http://plex-flaresolverr-flare-bypasser-http:8080
  # Family logins reuse calibre-web's user database (same accounts as
  # books.drewburr.com). The whole config dir is mounted (not just app.db)
  # so sqlite WAL/shm sidecar files stay visible to the reader.
  AUTH_METHOD: cwa
  CWA_DB_PATH: /auth-cw/app.db
  SESSION_COOKIE_SECURE: true
  # Subpath hosting under the books host (natively supported; UI, API,
  # assets, and Socket.IO all serve under this base).
  URL_BASE: /request/
  # Adds a "Library" button in shelfmark's header linking back to the library.
  CALIBRE_WEB_URL: https://books.drewburr.com

persistence:
  - name: shelfmark-config
    mountPath: config
    accessModes:
      - ReadWriteOnce
    requests: 10Gi
    storageClassName: zfs-nvmeof

additionalVolumes:
  - name: plex-data
    persistentVolumeClaim:
      claimName: plex-data
  - name: tmp-shelfmark
    emptyDir: {}
  - name: log-shelfmark
    emptyDir: {}
  - name: calibre-web-config
    persistentVolumeClaim:
      claimName: calibre-web-config
      readOnly: true

additionalVolumeMounts:
  - name: plex-data
    mountPath: /cwa-book-ingest
    subPath: books/ingest
  # sabnzbd/qbittorrent report completed paths under /data/downloads;
  # shelfmark must see the same paths to collect finished downloads.
  - name: plex-data
    mountPath: /data/downloads
    subPath: downloads
  - name: tmp-shelfmark
    mountPath: /tmp/shelfmark
  - name: log-shelfmark
    mountPath: /var/log/shelfmark
  - name: calibre-web-config
    mountPath: /auth-cw
    readOnly: true

nodeSelector: {}

tolerations:
  - key: compute
    operator: Exists
    effect: PreferNoSchedule

# Hard co-scheduling with calibre-web: calibre-web-config is RWO block
# storage (zfs-nvmeof), only mountable by pods on the same node.
affinity:
  podAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: plex-calibre-web
        topologyKey: kubernetes.io/hostname
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: compute
              operator: In
              values:
                - 'true'

# Same mkdir pattern as plex/calibre-web so shelfmark doesn't depend on
# calibre-web having synced first.
initContainers:
  - name: mkdir
    image:
      repository: alpine
      pullPolicy: Always
      tag: latest
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
    command:
      - sh
      - -c
      - mkdir -p /data/books/ingest
    volumeMountsOverride:
      - name: plex-data
        mountPath: /data

# Probe paths must live under URL_BASE — with /request/ set, nothing is
# served at / and the startup probe kills the pod after 5 minutes.
startupProbe:
  httpGet:
    path: /request/
    port: 8084
  failureThreshold: 30
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /request/
    port: 8084
readinessProbe:
  httpGet:
    path: /request/
    port: 8084
