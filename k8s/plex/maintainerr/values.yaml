# https://docs.maintainerr.info/
# Rules-based media cleanup: builds collections from Plex/Tautulli/Radarr/Sonarr/
# Overseerr rules, shows candidates, then deletes after a grace period.
# Deletes are routed THROUGH Radarr/Sonarr so torrents can keep seeding.
replicaCount: 1

image:
  # Development moved from jorenn92/maintainerr (frozen at 2.19.0) to the
  # maintainerr org.
  repository: ghcr.io/maintainerr/maintainerr
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Maintainerr does not use PUID/PGID; run as the media uid/gid directly.
podSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  fsGroupChangePolicy: "OnRootMismatch"

securityContext: {}

services:
  - name: http
    type: ClusterIP
    port: 6246
    protocol: TCP

resources: {}

env: []

envVars:
  TZ: America/New_York

# Maintainerr stores its SQLite DB + config under /opt/data.
persistence:
  - name: maintainerr-config
    mountPath: opt/data
    accessModes:
      - ReadWriteOnce
    requests: 5Gi
    storageClassName: zfs-nvmeof
  - name: backups

nodeSelector: {}

tolerations: []

affinity: {}

startupProbe:
  httpGet:
    path: /
    port: 6246
  failureThreshold: 30
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /
    port: 6246
readinessProbe:
  httpGet:
    path: /
    port: 6246

# ---------------------------------------------------------------------------
# Seeding-guard CronJob (see templates/seeding-guard-cronjob.yaml).
# Scans the shared plex-data library for files still hardlinked into the
# torrent dir (link count > 1 = an active torrent still references them) and
# applies the Plex label below to the owning movie/show -- whole show even if
# only one episode is seeding. Maintainerr review rules exclude that label,
# so labeled media can never be matched for cleanup. Labels are removed
# automatically once nothing is hardlinked anymore. The job never deletes.
# Scoped to plex-data ONLY; the alt ecosystem on plex-alt-data is untouched.
# ---------------------------------------------------------------------------
seedingGuard:
  enabled: true
  schedule: "0 6 * * *"   # daily 06:00
  image: python:3.12-slim
  # Plex label applied to seeding media; must match the Maintainerr rule guard.
  label: seeding
  # Library root inside the container (plex-data mounted at /data, same paths
  # Plex itself reports).
  libraryPath: /data/media
