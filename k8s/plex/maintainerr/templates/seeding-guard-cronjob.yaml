{{- if .Values.seedingGuard.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "maintainerr.fullname" . }}-seeding-guard
  labels:
    {{- include "maintainerr.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.seedingGuard.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          # Deliberately NOT the chart selectorLabels: those would match the
          # Service selector and make kube-proxy load-balance service traffic
          # to this job pod (instant connection-refused for callers).
          labels:
            app.kubernetes.io/name: {{ include "maintainerr.name" . }}-seeding-guard
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          # Run as the media uid/gid directly; no fsGroup -- it would make the
          # kubelet recursively chown the entire plex-data volume every mount.
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
          containers:
            - name: seeding-guard
              image: {{ .Values.seedingGuard.image | quote }}
              env:
                - name: PLEX_URL
                  value: {{ .Values.seedingGuard.plexUrl | quote }}
                - name: PLEX_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: plex-token
                      key: token
                - name: LIBRARY_PATH
                  value: {{ .Values.seedingGuard.libraryPath | quote }}
                - name: SEED_LABEL
                  value: {{ .Values.seedingGuard.label | quote }}
              command: ["python3", "/scripts/seeding-guard.py"]
              volumeMounts:
                - name: plex-data
                  mountPath: /data
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: plex-data
              persistentVolumeClaim:
                claimName: plex-data
            - name: backups
              persistentVolumeClaim:
                claimName: backups
            - name: script
              configMap:
                name: {{ include "maintainerr.fullname" . }}-seeding-guard
{{- end }}
