---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: relay
  labels:
    release: prometheus
    app.kubernetes.io/name: saucer-showdown-relay
spec:
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: saucer-showdown-relay
      app.kubernetes.io/component: metrics
