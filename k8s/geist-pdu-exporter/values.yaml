# Default values for geist-pdu-exporter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/drewburr/geist-pdu-exporter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.1.2"

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

env:
# Comma separated; optional name=address overrides the reported hostname
- name: PDU_TARGETS
  value: 192.168.4.3,192.168.4.16
# PDUs are polled in the background; scrapes are served from memory.
# pdu01 (v3) stalls for several seconds every 5 minutes, so allow a generous
# timeout. Readings older than PDU_MAX_AGE are dropped (pdu_up 0).
- name: POLLING_INTERVAL_SECONDS
  value: "10"
- name: PDU_REQUEST_TIMEOUT
  value: "20"
- name: PDU_MAX_AGE
  value: "60"

service:
  type: ClusterIP
  port: 9100

serviceMonitor:
  endpoint:
    # Scrapes are served from memory, so they're fast regardless of PDU speed.
    scrapeTimeout: 10s
    interval: 15s

resources:
  limits:
    cpu: 250m
    memory: 100Mi
  requests:
    cpu: 50m
    memory: 50Mi


nodeSelector: {}

tolerations: []

affinity: {}
